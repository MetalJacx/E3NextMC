name: Build E3Next

on:
  push:
    branches: [ master ]
    paths:
      - 'E3Next/**'
      - '.github/workflows/build-e3next.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore MQ2MonoSharp.sln

      - name: Build E3Next
        run: msbuild E3Next\E3Next.csproj /p:Configuration=Release /t:Rebuild /m

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: E3-dll
          path: |
            E3Next/bin/Release/E3.dll
            E3Next/bin/Release/E3.pdb
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          short_sha=$(git rev-parse --short HEAD)
          prev_tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)

          {
            echo "## What this fork adds over RekkasGit/E3Next"
            echo
            echo "- **Class Override** - run as any class on custom/multiclass-friendly servers where \`Me.Class\` is wrong or restrictive."
            echo "- **Configurable spell memorize method** - defaults to \`/memspell\`; switchable per-character (Misc_SpellMemorizeMethod) to a spellbook drag fallback for servers where \`/memspell\` is unreliable."
            echo "- **Accurate spell levels in E3Catalog** - shows each spell's real class-independent level (via \`MinCasterLevel\`) instead of a bogus 255 for spells your live class can't normally learn, plus a \"Hide higher level spells\" filter checkbox."
            echo "- **Persistent /cleartargets stick** - re-sticks/re-faces automatically if you get knocked off your target (fear, knockback, etc.) instead of only sticking once at engage."
            echo "- **Auto-synced with upstream** - a scheduled workflow merges fixes from RekkasGit/E3Next automatically, opening a PR instead of guessing if there's a conflict."
            echo "- **Every build published as a release** - a working E3.dll/E3.pdb is always available here, no need to build from source."
            echo
            echo "## Changes in this build"
            echo
            if [ -n "$prev_tag" ] && [ "$prev_tag" != "null" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${prev_tag}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" -20
            fi
          } > release_notes.md

          gh release create "build-${{ github.run_number }}" \
            E3Next/bin/Release/E3.dll \
            E3Next/bin/Release/E3.pdb \
            --title "Build ${{ github.run_number }} ($short_sha)" \
            --notes-file release_notes.md \
            --latest
